<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Telepatty 1.1 — دو زبان، ظاهر دلخواه، مجله، پیام خصوصی">
  <rect width="800" height="450" fill="#0a0f0d"/>
  <g fill="none" stroke="#1c2a24" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450"/>
  </g>

  <!-- brand -->
  <text x="60" y="78" font-family="monospace" font-size="30" fill="#00ff9d">Telepatty</text>
  <text x="60" y="106" font-family="monospace" font-size="15" fill="#5b6e66">release notes</text>
  <path d="M60 128h680" stroke="#1c2a24" stroke-width="2"/>

  <!-- version + what it means, in both languages -->
  <text x="60" y="252" font-family="monospace" font-size="110" fill="#00ff9d">v1.1</text>
  <text x="60" y="292" font-family="monospace" font-size="15" fill="#5b6e66">two languages · your own theme</text>
  <text x="60" y="314" font-family="monospace" font-size="15" fill="#5b6e66">a magazine · private messages</text>
  <text x="60" y="356" font-family="monospace" font-size="15" fill="#3a4a43">دو زبان · ظاهر دلخواه · مجله · پیام خصوصی</text>

  <!-- chip: two languages -->
  <g transform="translate(540,190)">
    <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#050807" stroke="#1c2a24"/>
    <g fill="none" stroke="#00ff9d" stroke-width="3" stroke-linecap="square">
      <path d="M-30 -8h46m0 0-9-9m9 9-9 9"/>
      <path d="M30 8h-46m0 0 9-9m-9 9 9 9"/>
    </g>
    <text y="30" font-family="monospace" font-size="12" fill="#5b6e66" text-anchor="middle">FA · EN</text>
  </g>

  <!-- chip: dark / light -->
  <g transform="translate(695,190)">
    <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#050807" stroke="#1c2a24"/>
    <circle cx="0" cy="-12" r="21" fill="none" stroke="#00ff9d" stroke-width="3"/>
    <path d="M0 -33a21 21 0 0 1 0 42z" fill="#00ff9d"/>
    <text y="30" font-family="monospace" font-size="12" fill="#5b6e66" text-anchor="middle">DARK · LIGHT</text>
  </g>

  <!-- chip: Magazine -->
  <g transform="translate(540,300)">
    <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#050807" stroke="#1c2a24"/>
    <g fill="none" stroke="#00ff9d" stroke-width="3">
      <rect x="-26" y="-32" width="52" height="40" rx="4"/>
      <path d="M-18 -22h36M-18 -12h24M-18 -2h30" stroke-linecap="square"/>
    </g>
    <text y="30" font-family="monospace" font-size="12" fill="#5b6e66" text-anchor="middle">Magazine</text>
  </g>

  <!-- chip: private messages -->
  <g transform="translate(695,300)">
    <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#050807" stroke="#1c2a24"/>
    <g fill="none" stroke="#00ff9d" stroke-width="3">
      <path d="M0 -34 26 -22v13c0 12-10 20-26 26-16-6-26-14-26-26v-13z"/>
      <path d="M-12 -10 0 2 14 -14" stroke-linecap="square"/>
    </g>
    <text y="30" font-family="monospace" font-size="12" fill="#5b6e66" text-anchor="middle">PRIVATE</text>
  </g>
</svg>
